<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFE600">
  <meta name="description" content="Control de horas para maquinistas">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Checkinistas">
  
  <title>Checkinistas - Control de Horas</title>
  
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top left, #6366f1 0, #4f46e5 35%, #7c3aed 60%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f9fafb;
    }
    .container {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 20px;
      padding: 32px 28px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 480px;
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.5);
    }
    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      background: #FFE600;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      box-shadow: 0 10px 30px rgba(255, 230, 0, 0.45);
    }
    .btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.3s;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">⚙️</div>
    <h1>Checkinistas</h1>
    <p>Control de horas para maquinistas</p>
    <button class="btn" onclick="window.location.href='https://script.google.com/a/macros/mercadolibre.com/s/AKfycbzk7T6axveFKFFhjeWWDZ_gzhCNv8kufVFxBuPzMu--pL9uthiRqSy1rlY7OpreObfvnw/exec'">
      Abrir aplicación
    </button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registrado:', reg))
          .catch(err => console.error('Error al registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
